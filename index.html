<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aleah J. Cocamas | Virtual Assistant & GoHighLevel Specialist</title>
    <meta
      name="description"
      content="Aleah J. Cocamas — Virtual Assistant and GoHighLevel Specialist helping businesses with CRM management, marketing automation, and admin support."
    />

    <!-- Browser tab + phone home-screen icon -->
    <link rel="icon" type="image/png" href="assets/images/brand/favicon.png" />
    <link rel="apple-touch-icon" href="assets/images/brand/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Styles: order matters (base → shared → sections → effects → motion) -->
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/sections/nav.css" />
    <link rel="stylesheet" href="assets/css/sections/hero.css" />
    <link rel="stylesheet" href="assets/css/sections/about.css" />
    <link rel="stylesheet" href="assets/css/sections/tools.css" />
    <link rel="stylesheet" href="assets/css/sections/skills.css" />
    <link rel="stylesheet" href="assets/css/sections/projects.css" />
    <link rel="stylesheet" href="assets/css/sections/experience.css" />
    <link rel="stylesheet" href="assets/css/sections/achievements.css" />
    <link rel="stylesheet" href="assets/css/sections/education.css" />
    <link rel="stylesheet" href="assets/css/sections/contact.css" />
    <link rel="stylesheet" href="assets/css/sections/footer.css" />
    <link rel="stylesheet" href="assets/css/effects.css" />
    <link rel="stylesheet" href="assets/css/motion.css" />
  </head>

  <body>
    <!-- Each section lives in its own file in /sections and is loaded by assets/js/include.js -->
    <div data-include="sections/nav.html"></div>

    <main class="page" id="page">
      <!-- Curvy background line that draws itself as you scroll (assets/js/scroll-line.js) -->
      <svg class="scroll-line" id="scrollLine" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="scrollLineGradient" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffb3c6" />
            <stop offset="0" stop-color="#fffdfe" />
            <stop offset="0.1875" stop-color="#ff8fab" />
            <stop offset="0.49" stop-color="#fffdfe" />
            <stop offset="0.57" stop-color="#ffb3c6" />
            <stop offset="0.72" stop-color="#ffc2d1" />
            <stop offset="0.83" stop-color="#fffdfe" />
          </linearGradient>
        </defs>
        <path class="scroll-line__path" fill="none" stroke="url(#scrollLineGradient)" stroke-linecap="round" stroke-linejoin="round" />
      </svg>

      <div data-include="sections/hero.html"></div>
      <div data-include="sections/about.html"></div>
      <div data-include="sections/tools.html"></div>
      <div data-include="sections/skills.html"></div>
      <div data-include="sections/projects.html"></div>
      <div data-include="sections/experience.html"></div>
      <div data-include="sections/achievements.html"></div>
      <div data-include="sections/education.html"></div>
      <div data-include="sections/contact.html"></div>
    </main>

    <div data-include="sections/footer.html"></div>

    <noscript>
      <p class="noscript">Please enable JavaScript to view this portfolio.</p>
    </noscript>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
